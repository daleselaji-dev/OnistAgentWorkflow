name: certify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run certification tests
        run: python -m unittest discover -s tests -v
      - name: Run deterministic demo
        run: python workflow/runtime.py --demo
      - name: Run trade-acquisition loop demo
        run: python workflow/acquisition.py --demo
